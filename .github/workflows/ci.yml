name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.wasmtime && 'with' || 'without' }} Wasmtime)
    runs-on: ubuntu-latest
    # The same Erlang image the platform check uses.
    container: erlang:29
    strategy:
      fail-fast: false
      matrix:
        # Wasmtime is optional: one run proves the Erlang workflow does not
        # need it, the other runs the two-engine tests and comparison.
        wasmtime: [true, false]
    env:
      WASMTIME_VERSION: 50.0.1
    steps:
      - uses: actions/checkout@v4

      - name: Install Wasmtime
        if: matrix.wasmtime
        run: |
          name="wasmtime-v${WASMTIME_VERSION}-x86_64-linux"
          curl -fsSL "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/${name}.tar.xz" \
            | tar -xJ -C /opt
          echo "/opt/${name}" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: rebar3-otp29-${{ hashFiles('rebar.config', 'rebar.lock') }}

      - name: Compile
        run: rebar3 compile

      - name: Unit tests
        run: rebar3 eunit

      - name: Cross-reference check
        run: rebar3 xref

      - name: Dialyzer
        if: matrix.wasmtime
        run: rebar3 dialyzer

      - name: Replay every saved reply
        run: bin/wasm-bytes demo

      - name: Run the recorded Sonnet module in erlang_wasm and Wasmtime
        if: matrix.wasmtime
        run: bin/wasm-bytes compare write trials/write/claude-sonnet-5-5-1/reply.txt
