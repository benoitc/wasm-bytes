<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 584" role="img" aria-labelledby="t d">
<title id="t">From three prompts to the demo page</title>
<desc id="d">First, the pan prompt asks a model for the Original module, and the runner checks its bytes. Second, the reverse prompt gives the model that module and asks for the Reversed one, which the runner checks too. bin/wasm-bytes pan-demo puts both modules in modules.js. Third, the ui prompt asks a model for the page, which the checker tests in headless Chrome. In your browser, the page loads modules.js, calls screen_pan(x) on the selected module, and plays a beep panned by the value divided by 500.</desc>
<style>
  .card { fill: #ffffff; stroke: #dedad1; }
  .box { fill: #f4f2ec; stroke: #d3cfc4; }
  .main { fill: #1d1d1b; font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .sub { fill: #66645e; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .title { fill: #1d1d1b; font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .num { fill: #c2410c; }
  .code { fill: #1d1d1b; font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .flow { stroke: #8a877f; stroke-width: 1.5; fill: none; }
  .head { fill: #8a877f; }
  .label { fill: #66645e; font: italic 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
  @media (prefers-color-scheme: dark) {
    .card { fill: #1e1e1c; stroke: #3d3c37; }
    .box { fill: #262624; stroke: #45443e; }
    .main, .title, .code { fill: #ecebe6; }
    .sub, .label { fill: #a3a19a; }
    .num { fill: #fb923c; }
    .flow { stroke: #8f8c84; }
    .head { fill: #8f8c84; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="head" d="M0 0L10 5L0 10z"/>
  </marker>
</defs>

<!-- 1. Module prompt -->
<rect class="card" x="40" y="10" width="410" height="88" rx="10"/>
<text class="title" x="50" y="30"><tspan class="num">1</tspan>  Module prompt</text>
<rect class="box" x="50" y="40" width="116" height="46" rx="6"/>
<text class="main" x="108" y="60" text-anchor="middle">pan prompt</text>
<text class="sub" x="108" y="76" text-anchor="middle">the rule, in words</text>
<rect class="box" x="187" y="40" width="116" height="46" rx="6"/>
<text class="main" x="245" y="60" text-anchor="middle">a model</text>
<text class="sub" x="245" y="76" text-anchor="middle">replies with hex</text>
<rect class="box" x="324" y="40" width="116" height="46" rx="6"/>
<text class="main" x="382" y="60" text-anchor="middle">the runner</text>
<text class="sub" x="382" y="76" text-anchor="middle">checks the bytes</text>
<line class="flow" x1="168" y1="63" x2="185" y2="63" marker-end="url(#arrow)"/>
<line class="flow" x1="305" y1="63" x2="322" y2="63" marker-end="url(#arrow)"/>

<line class="flow" x1="245" y1="98" x2="245" y2="136" marker-end="url(#arrow)"/>
<text class="label" x="255" y="122">Original module</text>

<!-- 2. Reverse prompt -->
<rect class="card" x="40" y="138" width="410" height="88" rx="10"/>
<text class="title" x="50" y="158"><tspan class="num">2</tspan>  Reverse prompt</text>
<rect class="box" x="50" y="168" width="116" height="46" rx="6"/>
<text class="main" x="108" y="188" text-anchor="middle">reverse prompt</text>
<text class="sub" x="108" y="204" text-anchor="middle">+ Original module</text>
<rect class="box" x="187" y="168" width="116" height="46" rx="6"/>
<text class="main" x="245" y="188" text-anchor="middle">a model</text>
<text class="sub" x="245" y="204" text-anchor="middle">replies with hex</text>
<rect class="box" x="324" y="168" width="116" height="46" rx="6"/>
<text class="main" x="382" y="188" text-anchor="middle">the runner</text>
<text class="sub" x="382" y="204" text-anchor="middle">checks the bytes</text>
<line class="flow" x1="168" y1="191" x2="185" y2="191" marker-end="url(#arrow)"/>
<line class="flow" x1="305" y1="191" x2="322" y2="191" marker-end="url(#arrow)"/>

<line class="flow" x1="245" y1="226" x2="245" y2="264" marker-end="url(#arrow)"/>
<text class="label" x="255" y="250">Original and Reversed modules</text>

<!-- pan-demo -->
<rect class="card" x="40" y="266" width="410" height="52" rx="10"/>
<text class="code" x="245" y="288" text-anchor="middle">bin/wasm-bytes pan-demo</text>
<text class="sub" x="245" y="306" text-anchor="middle">puts both modules in modules.js, as base64</text>

<line class="flow" x1="245" y1="318" x2="245" y2="356" marker-end="url(#arrow)"/>
<text class="label" x="255" y="342">then</text>

<!-- 3. Page prompt -->
<rect class="card" x="40" y="358" width="410" height="88" rx="10"/>
<text class="title" x="50" y="378"><tspan class="num">3</tspan>  Page prompt</text>
<rect class="box" x="50" y="388" width="116" height="46" rx="6"/>
<text class="main" x="108" y="408" text-anchor="middle">ui prompt</text>
<text class="sub" x="108" y="424" text-anchor="middle">the page to write</text>
<rect class="box" x="187" y="388" width="116" height="46" rx="6"/>
<text class="main" x="245" y="408" text-anchor="middle">a model</text>
<text class="sub" x="245" y="424" text-anchor="middle">replies with HTML</text>
<rect class="box" x="324" y="388" width="116" height="46" rx="6"/>
<text class="main" x="382" y="408" text-anchor="middle">the checker</text>
<text class="sub" x="382" y="424" text-anchor="middle">13 browser checks</text>
<line class="flow" x1="168" y1="411" x2="185" y2="411" marker-end="url(#arrow)"/>
<line class="flow" x1="305" y1="411" x2="322" y2="411" marker-end="url(#arrow)"/>

<line class="flow" x1="245" y1="446" x2="245" y2="484" marker-end="url(#arrow)"/>
<text class="label" x="255" y="470">the page, as index.html</text>

<!-- In your browser -->
<rect class="card" x="40" y="486" width="410" height="88" rx="10"/>
<text class="title" x="50" y="506">In your browser</text>
<rect class="box" x="50" y="516" width="116" height="46" rx="6"/>
<text class="main" x="108" y="536" text-anchor="middle">the page</text>
<text class="sub" x="108" y="552" text-anchor="middle">loads modules.js</text>
<rect class="box" x="187" y="516" width="116" height="46" rx="6"/>
<text class="code" x="245" y="536" text-anchor="middle">screen_pan(x)</text>
<text class="sub" x="245" y="552" text-anchor="middle">selected module</text>
<rect class="box" x="324" y="516" width="116" height="46" rx="6"/>
<text class="main" x="382" y="536" text-anchor="middle">a beep</text>
<text class="sub" x="382" y="552" text-anchor="middle">panned by v / 500</text>
<line class="flow" x1="168" y1="539" x2="185" y2="539" marker-end="url(#arrow)"/>
<line class="flow" x1="305" y1="539" x2="322" y2="539" marker-end="url(#arrow)"/>

<!-- modules.js goes beside the page -->
<path class="flow" d="M40 292H16V539H48" marker-end="url(#arrow)"/>
<text class="label" transform="translate(29 415) rotate(-90)" text-anchor="middle">modules.js, beside the page</text>
</svg>
